[project]
name = "tem-service"
description = "One HTTP service that runs the TEM image generation model (ImageNet classes) on the GPU for every project"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "torch==2.7.1",
    "torchvision==0.22.1",  # only for the ImageNet class names
    "diffusers==0.34.0",  # the Stable Diffusion VAE that decodes the latents
    "transformers==4.57.6",
    "huggingface-hub==0.34.6",
    "numpy>=2.1",
    "pillow>=11",
    "gdown>=5.2",  # the checkpoint is published on Google Drive
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "playwright>=1.40"]

[tool.uv]
package = false  # runs from src/, only the dependencies are installed

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true  # runs from src/, installs only the dependencies

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["real_model: needs tem_code/tem.py, the checkpoint and a GPU; skipped when they are missing"]
