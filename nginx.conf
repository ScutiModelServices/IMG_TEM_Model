# Load balancer in front of the tem replicas. Docker DNS gives `tem` one address per replica;
# nginx reads them at start, so restart this container after changing the replica count.
upstream tem {
    least_conn;
    server tem:9190 max_fails=2 fail_timeout=10s;
}

server {
    listen 9190;
    client_max_body_size 64k;

    location / {
        proxy_pass http://tem;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Internal-Token $http_x_internal_token;
        proxy_read_timeout 300s;
        # A generate call is a pure function of its body (a missing seed is drawn per call), so another replica may repeat it after a connection error.
        proxy_next_upstream error http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
